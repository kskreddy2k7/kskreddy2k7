name: Generate Snake Animation

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  
  # Allow manual execution
  workflow_dispatch:
  
  # Run on push to master/main
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user's contributions graph, outputting a svg animation.
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kskreddy2k7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF5722&color_dots=#16181D,#3c2b23,#694129,#9b5b2e,#d17833,#ffa03a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF5722&color_dots=#16181D,#3c2b23,#694129,#9b5b2e,#d17833,#ffa03a
            
      # Push the content of <build_dir> to a branch
      # The content will be available at https://raw.githubusercontent.com/<username>/<repo>/<branch>/<path>
      - name: Push github-contribution-grid-snake.svg to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
