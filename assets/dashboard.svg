<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .hud-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #6B7280;
        letter-spacing: 0.2em;
        font-weight: bold;
      }
      .hud-header {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 18px;
        fill: #FFFFFF;
      }
      .panel-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #E5E7EB;
      }
      .status-active {
        fill: #10B981;
        font-weight: bold;
      }
      .status-pending {
        fill: #FCD34D;
        font-weight: bold;
      }
      
      /* Glowing animations */
      @keyframes slowPulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.6; }
        100% { opacity: 0.3; }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gridPulse {
        0% { opacity: 0.05; }
        50% { opacity: 0.15; }
        100% { opacity: 0.05; }
      }

      .pulse-glow { animation: slowPulse 4s ease-in-out infinite; }
      .spinner { animation: spin 8s linear infinite; transform-origin: 135px 235px; }
      .bg-grid { animation: gridPulse 6s ease-in-out infinite; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#090A0C"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F1115" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2E3039" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="900" height="420" rx="20" fill="url(#bgGrad)" stroke="#2E3039" stroke-width="1.5" />
  
  <!-- Subtle Background Dot Grid -->
  <g class="bg-grid" fill="#FFFFFF" opacity="0.05">
    <circle cx="50" cy="50" r="1" /> <circle cx="100" cy="50" r="1" /> <circle cx="150" cy="50" r="1" /> <circle cx="200" cy="50" r="1" />
    <circle cx="250" cy="50" r="1" /> <circle cx="300" cy="50" r="1" /> <circle cx="350" cy="50" r="1" /> <circle cx="400" cy="50" r="1" />
    <circle cx="450" cy="50" r="1" /> <circle cx="500" cy="50" r="1" /> <circle cx="550" cy="50" r="1" /> <circle cx="600" cy="50" r="1" />
    <circle cx="650" cy="50" r="1" /> <circle cx="700" cy="50" r="1" /> <circle cx="750" cy="50" r="1" /> <circle cx="800" cy="50" r="1" />
    
    <circle cx="50" cy="150" r="1" /> <circle cx="100" cy="150" r="1" /> <circle cx="150" cy="150" r="1" /> <circle cx="200" cy="150" r="1" />
    <circle cx="250" cy="150" r="1" /> <circle cx="300" cy="150" r="1" /> <circle cx="350" cy="150" r="1" /> <circle cx="400" cy="150" r="1" />
    <circle cx="450" cy="150" r="1" /> <circle cx="500" cy="150" r="1" /> <circle cx="550" cy="150" r="1" /> <circle cx="600" cy="150" r="1" />
    
    <circle cx="50" cy="250" r="1" /> <circle cx="100" cy="250" r="1" /> <circle cx="150" cy="250" r="1" /> <circle cx="200" cy="250" r="1" />
    <circle cx="250" cy="250" r="1" /> <circle cx="300" cy="250" r="1" /> <circle cx="350" cy="250" r="1" /> <circle cx="400" cy="250" r="1" />
    
    <circle cx="50" cy="350" r="1" /> <circle cx="100" cy="350" r="1" /> <circle cx="150" cy="350" r="1" /> <circle cx="200" cy="350" r="1" />
    <circle cx="250" cy="350" r="1" /> <circle cx="300" cy="350" r="1" /> <circle cx="350" cy="350" r="1" /> <circle cx="400" cy="350" r="1" />
  </g>

  <!-- Title Header Bar -->
  <g transform="translate(30, 40)">
    <text x="0" y="0" class="hud-title">MISSION CONTROL</text>
    <text x="0" y="24" class="hud-header">OPERATING SYSTEM MONITOR</text>
    <circle class="pulse-glow" cx="300" cy="18" r="4.5" fill="#10B981" filter="url(#glow)" />
    <text x="312" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="bold">ONLINE</text>
  </g>

  <!-- ================= PANEL 1: SYSTEM HEALTH (Left) ================= -->
  <g transform="translate(30, 95)">
    <rect width="250" height="295" rx="12" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="20" y="25" class="hud-title">SYS STATUS</text>
    
    <!-- CPU/MEM indicators -->
    <g transform="translate(20, 50)">
      <text x="0" y="10" class="panel-label">CORE LOAD</text>
      <rect x="0" y="18" width="210" height="8" rx="4" fill="#1F2937" />
      <rect x="0" y="18" width="168" height="8" rx="4" fill="url(#orangeGrad)" filter="url(#glow)" />
      <text x="210" y="13" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF5722" font-weight="bold" text-anchor="end">80%</text>
    </g>

    <g transform="translate(20, 100)">
      <text x="0" y="10" class="panel-label">MEMORY UT</text>
      <rect x="0" y="18" width="210" height="8" rx="4" fill="#1F2937" />
      <rect x="0" y="18" width="126" height="8" rx="4" fill="#FCD34D" />
      <text x="210" y="13" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FCD34D" font-weight="bold" text-anchor="end">60%</text>
    </g>

    <!-- Radar Sweep or Circle Gauge representation -->
    <g transform="translate(0, 30)">
      <circle cx="125" cy="190" r="45" fill="none" stroke="#2E3039" stroke-width="1.5" />
      <circle cx="125" cy="190" r="30" fill="none" stroke="#2E3039" stroke-width="1" />
      <!-- Scanning Line -->
      <line class="spinner" x1="125" y1="190" x2="125" y2="145" stroke="#FF5722" stroke-width="2" filter="url(#glow)" />
      <text x="125" y="208" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280" text-anchor="middle">ACTIVE THREAD</text>
      <circle cx="110" cy="165" r="3" fill="#10B981" />
      <circle cx="150" cy="180" r="2.5" fill="#FF5722" />
    </g>
  </g>

  <!-- ================= PANEL 2: ACTIVE PROJECTS (Center) ================= -->
  <g transform="translate(300, 95)">
    <rect width="300" height="295" rx="12" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="20" y="25" class="hud-title">ACTIVE PIPELINES</text>
    
    <!-- Pipeline Item 1 -->
    <g transform="translate(20, 50)">
      <circle cx="10" cy="15" r="4" fill="#FF5722" filter="url(#glow)" />
      <text x="24" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Building i2flow</text>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">CLASS: FLAGGED PRODUCTS // ACTIVE</text>
      <text x="260" y="18" class="status-active" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">RUNNING</text>
    </g>
    
    <!-- Pipeline Item 2 -->
    <g transform="translate(20, 115)">
      <circle cx="10" cy="15" r="4" fill="#FF5722" filter="url(#glow)" />
      <text x="24" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Creating AI Products</text>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">DEPLOYMENT: AGENTS/WEB // ACTIVE</text>
      <text x="260" y="18" class="status-active" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">SHIPPED</text>
    </g>

    <!-- Pipeline Item 3 -->
    <g transform="translate(20, 180)">
      <circle cx="10" cy="15" r="4" fill="#FCD34D" />
      <text x="24" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#E5E7EB">Learning Advanced ML</text>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">TOPIC: DEEP NEURAL NETS // RESEARCH</text>
      <text x="260" y="18" class="status-pending" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">IN_PROGRESS</text>
    </g>

    <!-- Decorative divider line -->
    <line x1="20" y1="242" x2="280" y2="242" stroke="#2E3039" stroke-width="1" />
    <text x="20" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6B7280">BATCHES IN EXECUTION: 1,422 // LOSS: 0.024</text>
  </g>

  <!-- ================= PANEL 3: OBJECTIVES & META (Right) ================= -->
  <g transform="translate(620, 95)">
    <rect width="250" height="295" rx="12" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="20" y="25" class="hud-title">TARGETS &amp; META</text>
    
    <!-- Open Source -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Open Source Support</text>
      <rect x="0" y="25" width="210" height="4" rx="2" fill="#1F2937" />
      <rect x="0" y="25" width="210" height="4" rx="2" fill="#10B981" />
      <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981" font-weight="bold" text-anchor="end">ON</text>
    </g>

    <!-- Internship Ready -->
    <g transform="translate(20, 110)">
      <text x="0" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Internship Availability</text>
      <rect x="0" y="25" width="210" height="4" rx="2" fill="#1F2937" />
      <rect x="0" y="25" width="210" height="4" rx="2" fill="url(#orangeGrad)" />
      <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF5722" font-weight="bold" text-anchor="end">READY</text>
    </g>

    <!-- Coffee Intake -->
    <g transform="translate(20, 170)">
      <text x="0" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Coffee Engine Level</text>
      <rect x="0" y="25" width="210" height="4" rx="2" fill="#1F2937" />
      <rect x="0" y="25" width="189" height="4" rx="2" fill="#FCD34D" />
      <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCD34D" font-weight="bold" text-anchor="end">90%</text>
    </g>
    
    <!-- Code terminal output preview -->
    <g transform="translate(20, 225)">
      <rect width="210" height="50" rx="4" fill="#090A0C" />
      <text x="8" y="16" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">SYSTEM OK: 0 ERRORS</text>
      <text x="8" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6B7280">i2flow.worker -> listening...</text>
      <text x="8" y="40" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF5722">jobs: 12 ready, 0 stalled</text>
    </g>
  </g>
</svg>
