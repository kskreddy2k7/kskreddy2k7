<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="redOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D82A2A"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="metalCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A4F2A"/>
      <stop offset="100%" stop-color="#F2B895"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>
  <!-- Background glassmorphic box -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Monogram Graphic -->
  <g transform="translate(4, 4)" filter="url(#shadow)">
    <!-- Slanted Red-Orange Pillar (Left) -->
    <rect x="13" y="15" width="4.5" height="18" rx="2.25" transform="rotate(32 15.25 24)" fill="url(#redOrangeGrad)" />
    <!-- Slanted Copper Pillar (Right) -->
    <rect x="16.5" y="15" width="4.5" height="18" rx="2.25" transform="rotate(32 18.75 24)" fill="url(#metalCopper)" />
    <!-- "i" Dot -->
    <circle cx="13.5" cy="11.5" r="2.5" fill="url(#metalCopper)" />
    <!-- "2" superscript -->
    <path d="M 18 8 C 18 5.5, 22 5.5, 22 7.5 C 22 9.5, 19 11, 18.5 12 L 22.5 12 L 22.5 13 L 18 13 L 18 12 C 19 10.5, 21.5 9, 21.5 7.5 Z" fill="#E5E7EB" transform="scale(0.8) translate(4, 3)" />
    
    <!-- Top F Arm -->
    <path d="M 19 17.5 C 20.5 14, 23 13, 26 13 L 30 13 C 31 13, 31 14.5, 30 14.5 L 26 14.5 C 24 14.5, 22.5 15, 21 18 Z" fill="url(#metalCopper)" />
    <!-- Middle F Arm -->
    <path d="M 21.5 22.5 L 28 22.5 C 29 22.5, 29 24, 28 24 L 20.5 24 Z" fill="url(#metalCopper)" />
    <!-- Bottom Wave -->
    <path d="M 12 28.5 C 16 33.5, 20.5 34, 24.5 27 C 28 21.5, 31.5 20.5, 36.5 22 C 37.5 22.3, 37.5 23.8, 36.5 23.5 C 33 22.3, 30 23.3, 27 28.5 C 23.5 34.5, 18 33.5, 12 28.5 Z" fill="url(#redOrangeGrad)" />
  </g>
</svg>
