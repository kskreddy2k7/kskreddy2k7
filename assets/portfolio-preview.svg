<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .portfolio-title {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 24px;
        fill: #FFFFFF;
      }
      .portfolio-desc {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        fill: #9CA3AF;
        text-align: center;
      }
      
      /* Pulse glow animations */
      @keyframes slowFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      .floating-globe {
        animation: slowFloat 8s ease-in-out infinite;
        transform-origin: 450px 170px;
      }
      @keyframes glowPulse {
        0% { opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; }
      }
      .screen-glow {
        animation: glowPulse 6s ease-in-out infinite;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#090A0C"/>
    </linearGradient>

    <radialGradient id="sunriseGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#FF8A00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laptopMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="520" rx="20" fill="url(#bgGrad)" stroke="#2E3039" stroke-width="1.5" />

  <!-- Ambient Backdrop Glow -->
  <circle class="screen-glow" cx="450" cy="200" r="260" fill="url(#sunriseGlow)" />

  <!-- ================= MacBook Laptop Mockup ================= -->
  <g transform="translate(0, 30)">
    <!-- Screen Back Bezel Glow -->
    <rect x="210" y="50" width="480" height="290" rx="12" fill="#FF5722" opacity="0.05" filter="url(#glow)" />

    <!-- Screen Bezel -->
    <rect x="220" y="60" width="460" height="270" rx="10" fill="#0A0C10" stroke="#2E3039" stroke-width="2" />
    <!-- Camera Dot -->
    <circle cx="450" cy="67" r="2.5" fill="#1F2937" />
    <circle cx="450" cy="67" r="1" fill="#10B981" opacity="0.7" />

    <!-- Display Screen -->
    <rect x="230" y="76" width="440" height="244" rx="4" fill="url(#screenGrad)" />
    
    <!-- Vector WebGL Display content -->
    <g class="floating-globe" transform="translate(0, 0)">
      <!-- 3D Grid Perspective lines on screen -->
      <path d="M 230 260 L 670 260 M 230 280 L 670 280 M 230 300 L 670 300" stroke="#2E3039" stroke-width="0.8" opacity="0.5" />
      <path d="M 450 220 L 230 320 M 450 220 L 300 320 M 450 220 L 370 320 M 450 220 L 450 320 M 450 220 L 530 320 M 450 220 L 600 320 M 450 220 L 670 320" stroke="#2E3039" stroke-width="0.8" opacity="0.5" />
      
      <!-- Interactive Nodes / Particle sphere -->
      <circle cx="450" cy="170" r="45" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5" stroke-dasharray="3, 9" filter="url(#glow)" />
      <circle cx="450" cy="170" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
      
      <!-- Flow Nodes connected to sphere -->
      <circle cx="410" cy="150" r="3.5" fill="#FCD34D" filter="url(#glow)" />
      <circle cx="490" cy="190" r="3.5" fill="#FF5722" filter="url(#glow)" />
      <circle cx="430" cy="195" r="2.5" fill="#FFFFFF" />
      <circle cx="475" cy="140" r="2" fill="#FFFFFF" />
      
      <line x1="410" y1="150" x2="450" y2="170" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
      <line x1="490" y1="190" x2="450" y2="170" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
      
      <!-- Text mockup on screen -->
      <text x="450" y="245" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">KATA SAI KRANTHU REDDY</text>
      <text x="450" y="262" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF5722" text-anchor="middle" letter-spacing="0.3em">CINEMATIC 3D EXPERIENCE</text>
    </g>

    <!-- Laptop Base Keyboard Hinge -->
    <path d="M 210 330 L 690 330 L 690 333 L 210 333 Z" fill="#1F2937" />

    <!-- Laptop Bottom Case -->
    <path d="M 180 333 L 720 333 L 700 348 L 200 348 Z" fill="url(#laptopMetal)" stroke="#2E3039" stroke-width="1" />
    <!-- Opening Notch -->
    <rect x="420" y="333" width="60" height="4" rx="2" fill="#0D0E11" />
  </g>

  <!-- Description Section -->
  <text x="450" y="420" class="portfolio-desc" font-size="14" text-anchor="middle" font-weight="600">
    "Cinematic 3D developer experience with immersive animations and modern storytelling."
  </text>

  <!-- Explore Portfolio Button Visual representation -->
  <g transform="translate(350, 450)" filter="url(#glow)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="url(#orangeGrad)" opacity="0.9" />
    <text x="100" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#0D0E11" text-anchor="middle" letter-spacing="0.05em">EXPLORE PORTFOLIO</text>
  </g>
</svg>
