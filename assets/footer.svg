<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@800&amp;display=swap');
      
      .footer-quote {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: url(#orangeGrad);
        letter-spacing: 0.2em;
        text-anchor: middle;
      }
      .footer-sig-name {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .footer-sig-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #FCD34D;
        text-anchor: middle;
        letter-spacing: 0.15em;
      }
      
      /* Subtle animations */
      @keyframes floatQuote {
        0% { transform: translateY(0px); filter: drop-shadow(0 0 8px rgba(255, 87, 34, 0.1)); }
        50% { transform: translateY(-4px); filter: drop-shadow(0 0 20px rgba(255, 87, 34, 0.3)); }
        100% { transform: translateY(0px); filter: drop-shadow(0 0 8px rgba(255, 87, 34, 0.1)); }
      }
      .animated-quote {
        animation: floatQuote 6s ease-in-out infinite;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="260" rx="20" fill="url(#bgGrad)" stroke="#2E3039" stroke-width="1.5" />

  <!-- Animated Bottom Wave Graphic -->
  <path d="M 0 160 Q 225 120, 450 160 T 900 160 L 900 260 L 0 260 Z" fill="url(#waveGrad)" opacity="0.4" />
  <path d="M 0 180 Q 225 150, 450 180 T 900 180 L 900 260 L 0 260 Z" fill="url(#bgGrad)" />

  <!-- Central Motto / Quote -->
  <g class="animated-quote" transform="translate(450, 95)">
    <text x="0" y="0" class="footer-quote">BUILD. LEARN. SHIP. REPEAT.</text>
  </g>

  <!-- Signature section -->
  <g transform="translate(450, 165)">
    <text x="0" y="0" class="footer-sig-name">Kata Sai Kranthu Reddy</text>
    <text x="0" y="18" class="footer-sig-title">FOUNDER • i2flow</text>
  </g>

  <!-- Divider Line -->
  <line x1="300" y1="210" x2="600" y2="210" stroke="#2E3039" stroke-width="1" stroke-opacity="0.5" />

  <!-- Copyright / Technical Details -->
  <text x="450" y="235" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4B5563" text-anchor="middle">
    Designed with Developer OS guidelines. Powered by Git. 2026.
  </text>
</svg>
