<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .card-title {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #FFFFFF;
      }
      .card-desc {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        fill: #9CA3AF;
        line-height: 1.5;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #FCD34D;
        font-weight: bold;
      }
      .btn-text {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 10px;
        fill: #FFFFFF;
      }
      .btn-orange-text {
        fill: #0D0E11;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="5" y="5" width="410" height="210" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Top Icon & Title -->
  <g transform="translate(20, 25)">
    <!-- Custom Project Icon (Document Flow Theme) -->
    <circle cx="15" cy="15" r="15" fill="#FF5722" fill-opacity="0.15" />
    <path d="M 10 9 L 16 9 L 20 13 L 20 21 L 10 21 Z M 16 9 L 16 13 L 20 13" fill="none" stroke="#FF5722" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="12" y1="17" x2="18" y2="17" stroke="#FF5722" stroke-width="1" />
    
    <!-- Title -->
    <text x="40" y="19" class="card-title">EvoDoc Flow</text>
  </g>

  <!-- Star Count Badge Mock -->
  <g transform="translate(325, 27)">
    <rect width="70" height="20" rx="4" fill="#0D0E11" stroke="#2E3039" stroke-width="1" />
    <!-- Star Icon -->
    <path d="M 12 5 L 14 9 L 18 9.5 L 15 12.5 L 16 16.5 L 12 14.5 L 8 16.5 L 9 12.5 L 6 9.5 L 10 9 Z" fill="#FCD34D" />
    <text x="25" y="13" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E5E7EB" font-weight="bold">ACTIVE</text>
  </g>

  <!-- Project Description (wrapped text) -->
  <g transform="translate(20, 75)" class="card-desc">
    <text x="0" y="10">An evolutionary document workflow engine — automating</text>
    <text x="0" y="26">document parsing, classification, and routing pipelines</text>
    <text x="0" y="42">using NLP models and lightning-fast API microservices.</text>
  </g>

  <!-- Technology Badges -->
  <g transform="translate(20, 140)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="52" height="18" rx="4" fill="#1F2937" opacity="0.6" stroke="#FF5722" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="26" y="12" class="badge-text" fill="#FF5722" text-anchor="middle">PYTHON</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(58, 0)">
      <rect width="45" height="18" rx="4" fill="#1F2937" opacity="0.6" stroke="#FCD34D" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="22.5" y="12" class="badge-text" text-anchor="middle">REACT</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(109, 0)">
      <rect width="56" height="18" rx="4" fill="#1F2937" opacity="0.6" stroke="#FF5722" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="28" y="12" class="badge-text" fill="#FF5722" text-anchor="middle">FASTAPI</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(171, 0)">
      <rect width="40" height="18" rx="4" fill="#1F2937" opacity="0.6" stroke="#FCD34D" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="20" y="12" class="badge-text" text-anchor="middle">NLP</text>
    </g>
  </g>

  <!-- Action Buttons (Visual, wrapped in links in README) -->
  <!-- Repository Button -->
  <g transform="translate(20, 175)">
    <rect width="180" height="28" rx="6" fill="#1F2937" stroke="url(#btnBorder)" stroke-width="1" />
    <text x="90" y="17" class="btn-text" text-anchor="middle">Repository</text>
  </g>

  <!-- Live Demo Button -->
  <g transform="translate(215, 175)">
    <rect width="180" height="28" rx="6" fill="url(#orangeGrad)" opacity="0.9" filter="url(#glow)" />
    <text x="90" y="17" class="btn-text btn-orange-text" text-anchor="middle">Live Demo</text>
  </g>
</svg>
